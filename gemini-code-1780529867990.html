<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الطلبيات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; padding-bottom: 80px; /* مساحة للزر الثابت */ }
        .hidden-view { display: none !important; }
        
        /* تنسيق القوائم المنسدلة */
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: slideDown 0.3s ease-in-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 relative min-h-screen">

    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-blue-600">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">نظام الطلبيات</h2>
                <p class="text-gray-500 mt-2">تسجيل الدخول للموظفين</p>
            </div>
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full mb-4 p-3 bg-gray-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white transition">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full mb-6 p-3 bg-gray-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white transition">
            <button id="login-btn" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-md hover:shadow-lg">تسجيل الدخول</button>
        </div>
    </div>

    <div id="supervisor-view" class="hidden-view p-4 pb-24">
        <div class="max-w-3xl mx-auto">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100 sticky top-4 z-40">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">لوحة المشرف</h2>
                    <p id="branch-name-display" class="text-blue-600 font-semibold text-sm mt-1"></p>
                </div>
                <button class="logout-btn bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-100 transition border border-red-200">تسجيل الخروج</button>
            </div>

            <div id="products-list-supervisor" class="space-y-4">
                </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-50 flex justify-center">
            <button id="submit-order-btn" class="w-full max-w-3xl bg-green-600 text-white p-4 rounded-xl text-lg font-bold hover:bg-green-700 transition flex justify-center items-center gap-2 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                <span id="order-btn-text">إرسال الطلبية للفرع الرئيسي</span>
            </button>
        </div>
    </div>

    <div id="admin-view" class="hidden-view p-4">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-6 bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">لوحة التحكم الرئيسية</h2>
                    <p class="text-gray-500 text-sm mt-1">إدارة الطلبيات والمنتجات</p>
                </div>
                <div class="flex gap-3">
                    <button id="export-all-orders-btn" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition shadow-sm flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        تحميل تقرير اليوم المجمع
                    </button>
                    <button class="logout-btn bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-100 transition border border-red-200">خروج</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6">
                <h3 class="font-bold text-lg mb-4 text-gray-700 border-b pb-2">تحديث قاعدة المنتجات (استيراد إكسل)</h3>
                <div class="flex items-center gap-4">
                    <input type="file" id="excel-import" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition cursor-pointer">
                    <button id="import-btn" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-blue-700 transition whitespace-nowrap shadow-sm">تحديث المنتجات</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-lg mb-4 text-gray-700 border-b pb-2">طلبيات اليوم</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto">
                        <thead class="bg-gray-50 text-gray-600 text-sm">
                            <tr>
                                <th class="px-4 py-3 text-right rounded-r-lg">الفرع</th>
                                <th class="px-4 py-3 text-right">الوقت</th>
                                <th class="px-4 py-3 text-right">الإجمالي</th>
                                <th class="px-4 py-3 text-center rounded-l-lg">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBkuTC4Z4j0r0JEDatdEVOwV3-7ypQVE-A",
            authDomain: "branches-orders.firebaseapp.com",
            projectId: "branches-orders",
            storageBucket: "branches-orders.firebasestorage.app",
            messagingSenderId: "295767125653",
            appId: "1:295767125653:web:e846db77c80e3dca1f759c",
            measurementId: "G-3K8EK3S5DK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;
        let globalProducts = [];
        let globalOrders = []; // تخزين الطلبيات للوصول لها عند تفاصيل الطلبية

        // التنقل بين الشاشات
        function showView(viewId) {
            ['login-view', 'supervisor-view', 'admin-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden-view');
            });
            document.getElementById(viewId).classList.remove('hidden-view');
        }

        // تسجيل الدخول والخروج
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(!email || !pass) return Swal.fire('تنبيه', 'يرجى إدخال البريد وكلمة المرور', 'warning');
            
            try {
                // إضافة Loading state للزر
                const btn = document.getElementById('login-btn');
                btn.innerHTML = 'جاري الدخول...';
                await signInWithEmailAndPassword(auth, email, pass);
                btn.innerHTML = 'تسجيل الدخول';
            } catch (error) {
                Swal.fire('خطأ', 'بيانات الدخول غير صحيحة', 'error');
                document.getElementById('login-btn').innerHTML = 'تسجيل الدخول';
            }
        });

        document.querySelectorAll('.logout-btn').forEach(btn => {
            btn.addEventListener('click', () => signOut(auth));
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    if (currentUserData.role === 'admin') {
                        showView('admin-view');
                        loadAdminData();
                    } else {
                        showView('supervisor-view');
                        document.getElementById('branch-name-display').innerText = `الفرع الحالي: ${currentUserData.branch}`;
                        loadSupervisorProducts();
                    }
                } else {
                    Swal.fire('خطأ', 'لا توجد صلاحيات مسجلة لهذا الحساب', 'error');
                    signOut(auth);
                }
            } else {
                showView('login-view');
            }
        });

        // ==========================================
        // === منطق المشرف (الأقسام المنسدلة) ===
        // ==========================================
        async function loadSupervisorProducts() {
            const querySnapshot = await getDocs(collection(db, "products"));
            globalProducts = [];
            const categories = {};

            querySnapshot.forEach((doc) => {
                const product = { id: doc.id, ...doc.data(), quantity: 0 };
                globalProducts.push(product);
                
                // تجميع المنتجات حسب التصنيف
                const catName = product.category || 'أخرى';
                if (!categories[catName]) categories[catName] = [];
                categories[catName].push(product);
            });

            const container = document.getElementById('products-list-supervisor');
            container.innerHTML = '';

            // إنشاء الأقسام المنسدلة (Accordions)
            for (const [catName, products] of Object.entries(categories)) {
                const details = document.createElement('details');
                details.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden group";
                
                // رأس القسم
                const summary = document.createElement('summary');
                summary.className = "p-4 font-bold text-lg bg-gray-50 flex justify-between items-center text-gray-700 hover:bg-gray-100 transition";
                summary.innerHTML = `
                    <span>${catName} <span class="text-sm font-normal text-gray-500">(${products.length} منتجات)</span></span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-open:rotate-180 transition duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                `;
                details.appendChild(summary);

                // حاوية المنتجات داخل القسم
                const listDiv = document.createElement('div');
                listDiv.className = "p-4 space-y-3 border-t border-gray-100";

                products.forEach(p => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "flex justify-between items-center bg-white p-3 rounded-lg border border-gray-100 hover:border-blue-200 transition";
                    itemDiv.innerHTML = `
                        <div class="w-1/2">
                            <p class="font-bold text-gray-800">${p.name}</p>
                            <p class="text-xs text-gray-500 mt-1">السعر: ${p.price} د.ا | الضريبة: ${p.tax}%</p>
                        </div>
                        <div class="flex items-center space-x-3 space-x-reverse bg-gray-50 rounded-lg p-1 border border-gray-200">
                            <button onclick="updateQty('${p.id}', 1)" class="bg-blue-600 text-white w-8 h-8 rounded-md font-bold hover:bg-blue-700">+</button>
                            <span id="qty-${p.id}" class="w-8 text-center font-bold text-lg">0</span>
                            <button onclick="updateQty('${p.id}', -1)" class="bg-red-500 text-white w-8 h-8 rounded-md font-bold hover:bg-red-600">-</button>
                        </div>
                    `;
                    listDiv.appendChild(itemDiv);
                });

                details.appendChild(listDiv);
                container.appendChild(details);
            }
            updateTotalBtnLabel();
        }

        window.updateQty = (id, change) => {
            const product = globalProducts.find(p => p.id === id);
            if (product) {
                product.quantity = Math.max(0, product.quantity + change);
                document.getElementById(`qty-${id}`).innerText = product.quantity;
                updateTotalBtnLabel();
            }
        };

        function updateTotalBtnLabel() {
            const totalQty = globalProducts.reduce((sum, p) => sum + p.quantity, 0);
            const btnText = document.getElementById('order-btn-text');
            if(totalQty > 0) {
                btnText.innerText = `إرسال الطلبية (${totalQty} منتجات)`;
            } else {
                btnText.innerText = `إرسال الطلبية للفرع الرئيسي`;
            }
        }

        // إرسال الطلبية (واتساب + تخزين)
        document.getElementById('submit-order-btn').addEventListener('click', async () => {
            const orderedItems = globalProducts.filter(p => p.quantity > 0);
            if (orderedItems.length === 0) {
                return Swal.fire('تنبيه', 'لم تقم بتحديد أي منتجات!', 'warning');
            }

            let orderTotal = 0;
            let whatsappText = `*📦 طلبية جديدة - ${currentUserData.branch}*\n\n`;

            orderedItems.forEach(item => {
                const itemTotal = item.quantity * item.price;
                const taxAmount = itemTotal * (item.tax / 100);
                const finalTotal = itemTotal + taxAmount;
                orderTotal += finalTotal;

                whatsappText += `▪️ ${item.name}: الكمية *${item.quantity}*\n`;
            });

            whatsappText += `\n*الإجمالي النهائي:* ${orderTotal.toFixed(2)}`;

            try {
                await addDoc(collection(db, "orders"), {
                    branch: currentUserData.branch,
                    items: orderedItems,
                    total: orderTotal,
                    timestamp: serverTimestamp()
                });

                // تصفير الكميات بعد الحفظ
                loadSupervisorProducts(); 
                
                Swal.fire({
                    icon: 'success',
                    title: 'تم إرسال الطلبية للنظام',
                    text: 'سيتم تحويلك الآن للواتساب...',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(whatsappText)}`;
                    window.open(waUrl, '_blank');
                });

            } catch (error) {
                Swal.fire('خطأ', 'فشل في حفظ الطلبية يرجى المحاولة لاحقاً', 'error');
            }
        });

        // ==========================================
        // === منطق الإدارة (الإكسل المتقدم والتفاصيل) ===
        // ==========================================
        async function loadAdminData() {
            // جلب الطلبيات مرتبة من الأحدث للأقدم
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            
            globalOrders = [];
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';

            querySnapshot.forEach(doc => {
                const order = { id: doc.id, ...doc.data() };
                globalOrders.push(order);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 transition";
                const dateString = order.timestamp ? order.timestamp.toDate().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }) : 'الآن';
                
                tr.innerHTML = `
                    <td class="px-4 py-4 text-right font-bold text-gray-700">${order.branch}</td>
                    <td class="px-4 py-4 text-right text-gray-500" dir="ltr">${dateString}</td>
                    <td class="px-4 py-4 text-right font-bold text-green-600">${order.total.toFixed(2)} د.ا</td>
                    <td class="px-4 py-4 text-center">
                        <button onclick="viewOrderDetails('${order.id}')" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-200 transition">عرض وتنزيل الإكسل</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // عرض تفاصيل طلبية محددة في Popup
        window.viewOrderDetails = (orderId) => {
            const order = globalOrders.find(o => o.id === orderId);
            if(!order) return;

            let itemsHtml = `
                <table class="w-full text-right border-collapse mt-4 text-sm">
                    <thead>
                        <tr class="bg-gray-100"><th class="p-2 border">المنتج</th><th class="p-2 border">الكمية</th><th class="p-2 border">الإجمالي الفرعي</th></tr>
                    </thead>
                    <tbody>
            `;
            
            order.items.forEach(item => {
                const itemTotal = (item.quantity * item.price * (1 + item.tax/100)).toFixed(2);
                itemsHtml += `<tr><td class="p-2 border">${item.name}</td><td class="p-2 border font-bold">${item.quantity}</td><td class="p-2 border">${itemTotal}</td></tr>`;
            });
            
            itemsHtml += `</tbody></table>`;

            Swal.fire({
                title: `تفاصيل طلبية: ${order.branch}`,
                html: itemsHtml,
                width: 600,
                showCancelButton: true,
                confirmButtonText: 'تنزيل الطلبية إكسل',
                cancelButtonText: 'إغلاق',
                confirmButtonColor: '#10b981'
            }).then((result) => {
                if (result.isConfirmed) {
                    downloadSingleOrderExcel(order);
                }
            });
        };

        // تنزيل إكسل لطلبية واحدة
        function downloadSingleOrderExcel(order) {
            const wsData = [
                ["معلومات الطلبية"],
                ["الفرع:", order.branch],
                ["التاريخ:", order.timestamp ? order.timestamp.toDate().toLocaleString('ar-EG') : ''],
                [],
                ["اسم المنتج", "التصنيف", "الكمية", "سعر الوحدة", "الضريبة", "المجموع الفرعي"]
            ];

            order.items.forEach(item => {
                const subTotal = item.quantity * item.price * (1 + item.tax/100);
                wsData.push([item.name, item.category, item.quantity, item.price, item.tax + "%", subTotal.toFixed(2)]);
            });

            wsData.push([]);
            wsData.push(["", "", "", "", "الإجمالي النهائي:", order.total.toFixed(2)]);

            const worksheet = XLSX.utils.aoa_to_sheet(wsData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الطلبية");
            XLSX.writeFile(workbook, `طلبية_${order.branch}.xlsx`);
        }

        // تنزيل إكسل المجمع لكل الطلبيات
        document.getElementById('export-all-orders-btn').addEventListener('click', () => {
            if(globalOrders.length === 0) return Swal.fire('تنبيه', 'لا يوجد طلبيات مسجلة', 'info');

            let wsData = [
                ["التقرير الشامل للطلبيات"],
                ["تاريخ استخراج التقرير:", new Date().toLocaleString('ar-EG')],
                []
            ];

            let grandTotalAllOrders = 0;

            globalOrders.forEach((order, index) => {
                wsData.push([`--- طلبية رقم ${index + 1} ---`]);
                wsData.push(["الفرع:", order.branch, "وقت الطلب:", order.timestamp ? order.timestamp.toDate().toLocaleString('ar-EG') : '']);
                wsData.push(["المنتج", "التصنيف", "الكمية", "سعر الوحدة", "الضريبة", "المجموع الفرعي"]);
                
                order.items.forEach(item => {
                    const subTotal = item.quantity * item.price * (1 + item.tax/100);
                    wsData.push([item.name, item.category, item.quantity, item.price, item.tax + "%", subTotal.toFixed(2)]);
                });
                
                wsData.push(["", "", "", "", "مجموع هذه الطلبية:", order.total.toFixed(2)]);
                wsData.push([]); // سطر فارغ بين الطلبيات
                
                grandTotalAllOrders += order.total;
            });

            // السطر النهائي للمجموع الكلي
            wsData.push(["==================================================="]);
            wsData.push(["المجموع الكلي لجميع طلبيات اليوم:", "", "", "", "", grandTotalAllOrders.toFixed(2)]);

            const worksheet = XLSX.utils.aoa_to_sheet(wsData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "التقرير الشامل");
            XLSX.writeFile(workbook, `التقرير_الشامل_${new Date().toLocaleDateString('en-GB').replace(/\//g, '-')}.xlsx`);
        });

        // استيراد وتحديث المنتجات
        document.getElementById('import-btn').addEventListener('click', () => {
            const fileInput = document.getElementById('excel-import');
            if (!fileInput.files.length) return Swal.fire('تنبيه', 'يرجى اختيار ملف الإكسل أولاً', 'warning');
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                try {
                    Swal.fire({ title: 'جاري التحديث...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    // ملاحظة احترافية: يُفضل مسح المنتجات القديمة قبل استيراد الجديدة، لكن للتبسيط سنقوم بالإضافة هنا.
                    // لتحسين المشروع مستقبلاً يمكن استخدام خاصية Batch لكتابة المنتجات ومسح القديم.
                    for (const item of jsonData) {
                        await addDoc(collection(db, "products"), {
                            name: item['الاسم'],
                            price: parseFloat(item['السعر']),
                            tax: parseFloat(item['الضريبة']),
                            category: item['التصنيف'] || 'عام'
                        });
                    }
                    Swal.fire('تم بنجاح', 'تم تحديث قائمة المنتجات في النظام', 'success');
                } catch (error) {
                    Swal.fire('خطأ', 'حدث خطأ أثناء رفع المنتجات لقاعدة البيانات', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
